name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller packaging/bilingualz.spec --noconfirm

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\bilingualz.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Bilingualz-windows
          path: |
            dist/Bilingualz
            dist/Bilingualz-Setup-*.exe
          if-no-files-found: error
